function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${drawings[name]||drawings.file}</svg>`;}
function badge(s){const [label,c]=statusMap[s]||[s,'gray'];return `<span class="badge ${c}"><i class="dot"></i>${esc(label)}</span>`;}
function initials(s){return String(s||'Demo').split(' ').filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();}
function avatar(name,i=0,large=false){return `<span class="avatar ${i%3===1?'alt':i%3===2?'blue':''} ${large?'large':''}">${esc(initials(name))}</span>`;}
function nameOf(p){return p?[p.firstName,p.lastName].filter(Boolean).join(' '):'Paciente';}

const fmtTime=d=>new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(d));
const dateKey=(d=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));
const fmtDate=(d,short=false)=>new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'numeric',month:short?'short':'long',...(short?{}:{weekday:'long'})}).format(new Date(d.length===10?`${d}T12:00:00-03:00`:d));
const plusDays=(s,n)=>dateKey(new Date(Date.parse(`${s}T12:00:00-03:00`)+n*86400000));
const localAt=(d,t)=>new Date(`${d}T${t}:00-03:00`).toISOString();

async function api(path,method='GET',body=null,headers={}){
 if(PREVIEW)return window.PREVIEW_API(path,method,body,headers);
 const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json',...(S.session?.csrf?{'X-CSRF-Token':S.session.csrf}:{}),...headers},...(body===null?{}:{body:JSON.stringify(body)})});
 let data;try{data=await r.json();}catch{throw Error('Respuesta inválida del servidor local.');}
 if(!r.ok){const error=Error(data.error||'No se pudo completar la operación.');error.status=r.status;error.code=data.code;throw error;}return data;
}
function toast(message,error=false){const e=document.createElement('div');e.className=`toast ${error?'error':''}`;e.setAttribute('role','status');e.innerHTML=icon(error?'warning':'checkcircle',18)+`<span>${esc(message)}</span>`;$('#toasts').append(e);setTimeout(()=>e.remove(),5000);}

function scheduleView(){
 const chosen=S.data.appointments.filter(a=>dateKey(a.startAt)===S.date&&(!S.doctor||a.doctorId===S.doctor)).sort((a,b)=>a.startAt.localeCompare(b.startAt));
 let day='';
 if(S.calendar==='day'){
  const keys=new Set(Array.from({length:18},(_,i)=>`${String(9+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`));for(const a of chosen)keys.add(fmtTime(a.startAt));
  day=[...keys].sort().map(t=>{
   const active=chosen.filter(a=>fmtTime(a.startAt)===t&&a.status!=='CANCELLED');
   const busy=chosen.filter(a=>a.status!=='CANCELLED'&&a.startAt<=localAt(S.date,t)&&a.endAt>localAt(S.date,t));
   const canBook=busy.length<(S.doctor?1:S.data.doctors.length);
   return `<div class="slot"><span class="slot-time">${t}</span><div class="slot-content">${active.map(a=>`<button class="slot-booking" data-action="appointment-detail" data-id="${a.id}">${avatar(nameOf(patientBy(a.patientId)))}<span class="grow" style="text-align:left"><span class="patient-name">${esc(nameOf(patientBy(a.patientId)))}</span><span class="patient-sub" style="display:block">${esc(types[a.type])} · ${esc(doctorBy(a.doctorId)?.name)}</span></span>${badge(a.status)}</button>`).join('')}${!active.length&&busy.length?'<span class="tiny muted">Turno en curso en este intervalo</span>':''}${canBook?`<button class="free-slot" data-action="new-appointment" data-time="${t}">${icon('plus',12)} ${active.length||busy.length?'Otro profesional disponible':'Espacio disponible'}</button>`:''}</div></div>`;
  }).join('');
 }else{
  const weekday=new Date(`${S.date}T12:00:00-03:00`).getUTCDay();const monday=plusDays(S.date,weekday===0?-6:1-weekday);
  day=`<div class="week-grid">${Array.from({length:5},(_,i)=>{const d=plusDays(monday,i),rows=S.data.appointments.filter(a=>dateKey(a.startAt)===d&&a.status!=='CANCELLED'&&(!S.doctor||a.doctorId===S.doctor)).sort((a,b)=>a.startAt.localeCompare(b.startAt));return `<div class="week-day"><div class="week-heading">${esc(fmtDate(d,true))}</div>${rows.map(a=>`<button class="week-event" data-action="appointment-detail" data-id="${a.id}"><b>${fmtTime(a.startAt)}</b> · ${esc(nameOf(patientBy(a.patientId)))}<div class="tiny muted">${esc(types[a.type])}</div></button>`).join('')}<button class="free-slot" style="width:100%" data-action="new-appointment" data-date="${d}">${icon('plus',12)} Agendar</button></div>`;}).join('')}</div>`;
 }
 return heading('Una agenda sin cruces.','Turnos por profesional. Horarios en Buenos Aires (UTC−03).',btn('Nuevo turno','new-appointment','plus','primary'))+
 `<div class="schedule-layout"><section class="panel"><div class="toolbar between"><div class="date-controls"><button class="icon-btn" data-action="prev-date" aria-label="Día anterior">${icon('left',15)}</button><input type="date" aria-label="Fecha de la agenda" value="${S.date}" data-change="date"><button class="icon-btn" data-action="next-date" aria-label="Día siguiente">${icon('chevron',15)}</button>${btn('Hoy','today','','small')}</div><div class="segmented"><button data-action="calendar-mode" data-value="day" class="${S.calendar==='day'?'active':''}">Día</button><button data-action="calendar-mode" data-value="week" class="${S.calendar==='week'?'active':''}">Semana</button></div></div><div class="toolbar"><select data-change="doctor" aria-label="Filtrar por profesional"><option value="">Todos los profesionales</option>${S.data.doctors.map(d=>`<option value="${d.id}" ${S.doctor===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><span class="muted tiny">${chosen.filter(a=>a.status!=='CANCELLED').length} turnos activos en esta fecha</span></div>${day}<div class="panel-footer"><span>Los turnos cancelados liberan el horario.</span><span>${chosen.filter(a=>a.status==='CANCELLED').length} cancelados</span></div></section><aside class="stack schedule-aside"><section class="panel"><div class="panel-header"><h2>Equipo de atención</h2></div><div class="panel-body">${S.data.doctors.map((d,i)=>`<div class="attention-row">${avatar(d.name,i)}<div><h4>${esc(d.name)}</h4><p>${esc(d.specialty)}</p></div></div>`).join('')}</div></section><div class="info-box">${icon('shield',18)}<div><strong>Sin dobles reservas</strong><br>Se validan superposiciones del profesional y del paciente al guardar. La disponibilidad se confirma en el servidor.</div></div><div class="info-box warning">${icon('info',18)}<div>No se sincroniza con Google Calendar ni HighLevel. Solo modifica esta agenda local.</div></div></aside></div>`;
}

function field(label,name,type='text',value='',attrs='',full=false){return `<div class="form-field ${full?'full':''}"><label for="field-${name}">${label}</label><input id="field-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}></div>`;}
function area(label,name,value='',attrs='',full=true){return `<div class="form-field ${full?'full':''}"><label for="field-${name}">${label}</label><textarea id="field-${name}" name="${name}" ${attrs}>${esc(value)}</textarea></div>`;}
function selectField(label,name,options,selected='',full=false){return `<div class="form-field ${full?'full':''}"><label for="field-${name}">${label}</label><select id="field-${name}" name="${name}" required>${options.map(([v,l])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;}
function patientSelect(selected=''){return selectField('Paciente de prueba','patientId',S.data.patients.map(p=>[p.id,nameOf(p)]),selected||S.selectedPatient||S.data.patients[0]?.id,true);}
function patientForm(id){const p=id?patientBy(id):{};formDialog(id?'edit-patient':'patient',id?'Editar paciente':'Nuevo paciente','Usa únicamente información ficticia.',field('Nombre *','firstName','text',p.firstName||'','required maxlength="80"')+field('Apellido','lastName','text',p.lastName||'','maxlength="80"')+field('Teléfono *','phone','tel',p.phone||'','required minlength="6" maxlength="30" placeholder="+540000000099"')+field('Correo','email','email',p.email||'','maxlength="254"')+field('Documento de prueba','dni','text',p.dni||'','maxlength="40" placeholder="DEMO-009"')+field('Cobertura','coverage','text',p.coverage||'Particular','maxlength="100"')+area('Observaciones administrativas','notes',p.notes||'','maxlength="2000"'),id?'Guardar cambios':'Registrar paciente',id?`data-id="${id}"`:'');}
function appointmentForm(opts={}){
 if(!S.data.patients.length)return patientForm();
 const existing=opts.id?S.data.appointments.find(a=>a.id===opts.id):null;
 const date=existing?dateKey(existing.startAt):(opts.date||S.date),time=existing?fmtTime(existing.startAt):(opts.time||'09:00');
 const fields=patientSelect(existing?.patientId||opts.patientId)+selectField('Profesional','doctorId',S.data.doctors.map(d=>[d.id,d.name]),existing?.doctorId||S.doctor||S.data.doctors[0]?.id,true)+field('Fecha','date','date',date,'required')+field('Hora (Buenos Aires)','time','time',time,'required step="900"')+selectField('Duración','duration',[['15','15 minutos'],['30','30 minutos'],['45','45 minutos'],['60','60 minutos'],['90','90 minutos']],String(existing?.duration||30))+selectField('Tipo de atención','type',Object.entries(types),existing?.type||'CONSULTATION')+area('Nota administrativa','notes',existing?.notes||'','maxlength="2000"')+`<div class="form-field full"><div class="info-box">${icon('info',16)}<span>Se comprobarán cruces de agenda al guardar. No se enviará una confirmación por WhatsApp.</span></div></div>`;
 formDialog(existing?'reschedule':'appointment',existing?'Reprogramar turno':'Nuevo turno',existing?'El cambio solo afecta la agenda local.':'Selecciona un paciente ya registrado.',fields,existing?'Guardar reprogramación':'Agendar turno',existing?`data-id="${existing.id}"`:'');
 if(existing)$('#field-patientId').disabled=true;
}
function appointmentDetail(id){const a=S.data.appointments.find(x=>x.id===id);if(!a)return;const p=patientBy(a.patientId);
 formDialog('appointment-status','Detalle del turno',`${fmtDate(a.startAt)} · ${fmtTime(a.startAt)} hs`,
 `<div class="form-field full"><div class="patient-hero" style="margin-bottom:2px">${avatar(nameOf(p),0,true)}<div><h2>${esc(nameOf(p))}</h2><p class="muted text-sm">${esc(types[a.type])} · ${a.duration} min</p></div></div></div><div class="form-field full"><div class="info-box">${icon('calendar',17)}<span>${esc(doctorBy(a.doctorId)?.name)}<br>${esc(a.notes||'Sin observaciones')}</span></div></div>`+selectField('Estado del turno','status',['PENDING','CONFIRMED','IN_PROGRESS','COMPLETED','CANCELLED','NO_SHOW'].map(s=>[s,statusMap[s][0]]),a.status,true)+`<div class="form-field full flex">${btn('Reprogramar','reschedule','calendar','','type="button" data-id="'+id+'"')}${btn('Ver paciente','patient-detail','users','','type="button" data-id="'+a.patientId+'"')}</div>`, 'Actualizar estado',`data-id="${id}"`);

function patientDetail(id){const p=patientBy(id);if(!p)return;S.selectedPatient=id;const appts=S.data.appointments.filter(a=>a.patientId===id).sort((a,b)=>b.startAt.localeCompare(a.startAt));const records=S.data.records.filter(r=>r.patientId===id);

}
function recordForm(amendmentId=null){const old=amendmentId?S.data.records.find(r=>r.id===amendmentId):null;const pid=old?.patientId||S.selectedPatient;
 formDialog('record',old?'Agregar enmienda':'Nueva evolución SOAP','Registro local de prueba. No genera firma digital certificada.',patientSelect(pid)+area('S · Subjetivo *','subjective','','required maxlength="8000"',false)+area('O · Objetivo','objective','','maxlength="8000"',false)+area('A · Evaluación','assessment','','maxlength="8000"',false)+area('P · Plan *','plan','','required maxlength="8000"',false)+`<div class="form-field full"><label class="inline"><input type="checkbox" required>Confirmo que son datos ficticios. La evolución se guarda sin edición; cualquier corrección se registra como enmienda.</label></div>`,old?'Guardar enmienda':'Guardar evolución',old?`data-amendment="${old.id}"`:'','wide');

function paymentForm(patientId){const id=makeId();formDialog('payment','Registrar pago de prueba','Registro manual interno. No realiza ni confirma un cobro.',patientSelect(patientId)+field('Importe en ARS *','amount','number','','required min="0.01" max="10000000" step="0.01"')+selectField('Método informado','method',[['TRANSFERENCIA','Transferencia'],['EFECTIVO','Efectivo'],['TARJETA','Tarjeta'],['OTRO','Otro']])+field('Referencia de prueba','reference','text','','maxlength="200" placeholder="DEMO-TRANSFERENCIA-001"',true)+`<div class="form-field full"><label class="inline"><input type="checkbox" required>Entiendo que este registro no verifica una acreditación bancaria ni envía comprobantes.</label></div>`,'Guardar registro',`data-key="${id}"`);}
function invoiceForm(){formDialog('invoice','Borrador de comprobante','Documento interno sin CAE ni validez fiscal.',patientSelect()+field('Concepto *','concept','text','','required maxlength="500" placeholder="Concepto de demostración"',true)+field('Importe en ARS *','amount','number','','required min="0.01" max="10000000" step="0.01"',true)+`<div class="form-field full"><div class="info-box warning">${icon('info',16)}<span>ARCA no está conectado. Este borrador no reemplaza una factura.</span></div></div>`,'Guardar borrador');}
function prescriptionForm(){formDialog('prescription','Borrador de receta','No válido para dispensación, prescripción ni uso médico.',patientSelect()+area('Contenido de prueba *','content','','required maxlength="8000" placeholder="Escribe únicamente texto ficticio para probar el flujo."')+`<div class="form-field full"><div class="info-box warning">${icon('warning',16)}<span>No se genera firma certificada ni enlace público de receta válida.</span></div></div>`,'Guardar borrador');}
function leadForm(){formDialog('lead','Nuevo contacto','Contacto comercial de demostración. No se envían mensajes.',field('Nombre *','name','text','','required maxlength="120"')+field('Teléfono *','phone','tel','','required minlength="6" maxlength="30" placeholder="+540000001099"')+selectField('Origen informado','source',['Meta Ads','Google Ads','Web','Referido','WhatsApp','Otro'].map(x=>[x,x]))+field('Interés','interest','text','','maxlength="200"'),'Agregar contacto');}
const requirements={highlevel:['Implementar OAuth o credenciales privadas exclusivamente en servidor.','Vincular el Location ID a la clínica correspondiente.','Validar permisos, firmas de webhooks e idempotencia antes de sincronizar.'],whatsapp:['Configurar un número y una aplicación de WhatsApp Business.','Validar webhooks y plantillas, consentimiento y bajas.','Probar envío y recepción con números autorizados de prueba.'],google:['Implementar OAuth y almacenamiento seguro de tokens en servidor.','Elegir calendarios y reglas de correspondencia de profesionales.','Validar conflictos, renovaciones y sincronización bidireccional.'],mercadopago:['Implementar el proveedor en entorno de pruebas.','Crear preferencias reales con idempotencia y expiración.','Verificar estado y autenticidad del pago del lado del servidor.'],arca:['Implementar autorización y certificados del emisor en servidor.','Validar punto de venta y comprobantes en homologación.','Confirmar emisión real antes de presentar CAE o QR fiscal.'],ai:['Seleccionar un proveedor y definir alcance administrativo o clínico.','Revisar contratos de datos y autorizaciones antes de procesar información sensible.','Implementar controles, evaluación, supervisión humana y trazabilidad.']};
function integrationDetail(id){const i=S.data.integrations.find(x=>x.id===id);if(!i)return;showModal(i.name,'Estado: no conectado. Este módulo no está implementado en la demo.',`<div class="info-box warning">${icon('lock',18)}<span>No ingreses claves ni tokens en este formulario. No se guardan credenciales ni se realizan llamadas externas.</span></div><div class="spacer"></div><h3>Trabajo pendiente para habilitarlo</h3><ol class="line-list">${requirements[id].map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="dialog-actions">${btn('Cerrar','close-modal')}${btn('Comprobar bloqueo local','test-integration','shield','primary','data-id="'+id+'"')}</div>`);}
function assistantDialog(){if(!S.chat.length)S.chat=[{role:'assistant',text:'Hola. Puedo resumir la agenda, revisar pendientes y contar registros de cobros. Trabajo con reglas locales, sin un modelo de IA conectado. ¿Qué necesitas revisar?'}];showModal('Tu asistente operativo','DEMO POR REGLAS · No toma decisiones clínicas.',`<div class="chat-messages" id="chat-messages">${chatHtml()}</div><div class="suggestions"><button data-action="chat-suggestion" data-text="Resumen de la agenda de hoy">Agenda de hoy</button><button data-action="chat-suggestion" data-text="Turnos pendientes de confirmar">Pendientes</button><button data-action="chat-suggestion" data-text="Resumen de cobros">Cobros</button></div><form class="chat-form" data-form="chat"><input name="text" aria-label="Mensaje al asistente" placeholder="Pregunta por tu operación…" required maxlength="1000"><button type="submit" class="btn primary" aria-label="Enviar mensaje">${icon('send',17)}</button></form><div class="form-error" role="alert"></div>`,'','assistant');}
function chatHtml(){return S.chat.map(m=>`<div class="chat-bubble ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('');}
async function sendChat(text){S.chat.push({role:'user',text});$('#chat-messages').innerHTML=chatHtml();try{const r=await api('/api/copilot','POST',{text});S.chat.push({role:'assistant',text:r.answer});}catch(e){S.chat.push({role:'assistant',text:e.message});}if($('#chat-messages')){$('#chat-messages').innerHTML=chatHtml();$('#chat-messages').scrollTop=100000;}}
function help(){showModal('Qué funciona en esta entrega','Una base local ejecutable. No un sistema clínico habilitado para producción.',`<div class="stack"><div class="info-box">${icon('checkcircle',18)}<span><strong>Disponible:</strong> pacientes, agenda con validación de cruces, seguimiento, notas SOAP, enmiendas, borradores, registro manual de pagos y actividad.</span></div><div class="info-box warning">${icon('plug',18)}<span><strong>No conectado:</strong> HighLevel, WhatsApp, Google Calendar, Mercado Pago, ARCA ni proveedor de IA. No hay firma certificada ni verificación de pagos.</span></div><div class="info-box">${icon('lock',18)}<span>${PREVIEW?'Esta vista previa guarda datos en el navegador. Sus cuentas y permisos son solo simulaciones de interfaz.':'El servidor local usa SQLite, sesión HttpOnly y validación de clínica por sesión. No está diseñado para exposición pública ni contiene cifrado clínico certificado.'}</span></div></div><div class="dialog-actions">${btn('Entendido','close-modal','','primary')}</div>`);}
function exportPatients(){const header=['Nombre','Apellido','Documento demo','Telefono','Email','Cobertura','Estado'];const rows=S.data.patients.map(p=>[p.firstName,p.lastName,p.dni,p.phone,p.email,p.coverage,p.status]);const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const csv='\ufeff'+[header,...rows].map(r=>r.map(cell).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='clinic-os-pacientes-DEMO.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('CSV de datos de prueba generado.');}
async function verifyRecord(id){try{const r=await api('/api/verify/'+id);showModal('Integridad del registro','Comprobación técnica, no firma digital certificada.',`<div class="info-box ${r.integrity?'':'warning'}">${icon(r.integrity?'shield':'warning',20)}<div><strong>${r.integrity?'Integridad comprobada':'La integridad no coincide'}</strong><br>${esc(r.message)}</div></div><div class="spacer"></div><div class="detail-label">Hash SHA-256</div><div class="mono wrap">${esc(r.hash)}</div><div class="spacer"></div><div class="detail-label">Fecha</div><p class="detail-value">${fmtDate(r.createdAt,true)} · ${fmtTime(r.createdAt)}</p><div class="dialog-actions">${!PREVIEW?btn('Verificador público','open-verify','external','','data-id="'+id+'"'):''}${btn('Cerrar','close-modal','','primary')}</div>`);}catch(e){toast(e.message,true);}}
async function verifyPage(id){try{const r=await api('/api/verify/'+id);$('#app').innerHTML=`<main class="verify-page"><section class="panel verify-card"><div class="brandmark">+</div><div class="spacer"></div><span class="badge ${r.integrity?'green':'red'}">${r.integrity?'Integridad técnica comprobada':'Integridad no válida'}</span><h1>Verificador de demostración</h1><p>${esc(r.message)}</p><span class="mono wrap">${esc(r.hash)}</span><div class="info-box warning">${icon('info',18)}<span>No valida identidad profesional, matrícula, prescripción ni cumplimiento normativo. No se muestran datos del paciente.</span></div><div class="spacer"></div><a href="/" class="btn primary">Volver a Clinic OS</a></section></main>`;}catch(e){$('#app').innerHTML=`<main class="verify-page"><section class="panel verify-card"><h1>Registro no encontrado</h1><p>${esc(e.message)}</p><a href="/" class="btn">Volver</a></section></main>`;}}
// Delegated events keep dynamically-rendered views accessible and consistent.
document.addEventListener('click',async e=>{
 const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();closeModal();await navigate(nav.dataset.nav);return;}
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
 if(el.tagName==='BUTTON'&&el.closest('form')&&el.type==='submit'&&action)e.preventDefault();
 try{
  switch(action){
   case 'close-modal':closeModal();break;
   case 'show-password':{const p=$('#password');p.type=p.type==='password'?'text':'password';break;}
   case 'super-login':$('#email').value='superadmin@clinica.test';$('#password').value='demo-admin-2026';$('#email').focus();break;
   case 'logout':await api('/api/logout','POST',{});S.session=null;S.data=null;S.admin=null;closeModal();if(!PREVIEW)history.pushState({},'','/login');loginPage();break;
   case 'menu':S.mobile=!S.mobile;render();break;
   case 'help':help();break;
   case 'nav-schedule':await navigate('schedule');break;
   case 'home-filter':S.homeFilter=el.dataset.value;contentOnly();break;
   case 'pending-agenda':S.homeFilter='pending';contentOnly();break;
   case 'new-patient':patientForm();break;
   case 'edit-patient':patientForm(id);break;
   case 'patient-detail':patientDetail(id);break;
   case 'new-appointment':appointmentForm({time:el.dataset.time,date:el.dataset.date,patientId:el.dataset.patientId});break;
   case 'appointment-detail':appointmentDetail(id);break;
   case 'reschedule':appointmentForm({id});break;
   case 'prev-date':S.date=plusDays(S.date,S.calendar==='week'?-7:-1);contentOnly();break;
   case 'next-date':S.date=plusDays(S.date,S.calendar==='week'?7:1);contentOnly();break;
   case 'today':S.date=S.data.date;contentOnly();break;
   case 'calendar-mode':S.calendar=el.dataset.value;contentOnly();break;
   case 'new-lead':leadForm();break;
   case 'select-record-patient':S.selectedPatient=id;contentOnly();break;
   case 'open-patient-records':S.selectedPatient=id;closeModal();await navigate('records');break;
   case 'record-tab':S.recordTab=el.dataset.value;contentOnly();break;
   case 'new-record':if(!S.data.patients.length)patientForm();else recordForm();break;
   case 'amend-record':recordForm(id);break;
   case 'verify-record':await verifyRecord(id);break;
   case 'open-verify':window.open('/verify/'+encodeURIComponent(id),'_blank','noopener');break;
   case 'new-prescription':prescriptionForm();break;
   case 'new-payment':paymentForm(el.dataset.patientId);break;
   case 'new-invoice':invoiceForm();break;
   case 'billing-tab':S.billingTab=el.dataset.value;contentOnly();break;
   case 'export-patients':exportPatients();break;
   case 'integration-detail':integrationDetail(id);break;
   case 'test-integration':try{await api('/api/integrations/'+id+'/test','POST',{});}catch(err){if(err.code==='NOT_CONNECTED'){toast('Bloqueo comprobado: no se ejecutó ninguna acción externa.');}else throw err;}break;
   case 'setting-toggle':{el.disabled=true;const key=el.dataset.key;await api('/api/settings','PATCH',{[key]:!S.data.settings[key]});await refresh();contentOnly();toast('Control local actualizado.');break;}
   case 'assistant':assistantDialog();break;
   case 'chat-suggestion':el.disabled=true;await sendChat(el.dataset.text);el.disabled=false;break;
   case 'new-workspace':formDialog('workspace','Nueva clínica de prueba','Se crea un espacio vacío, sin usuarios ni integraciones.',field('Nombre *','name','text','','required minlength="2" maxlength="100"',true),'Crear clínica');break;
  }
 }catch(err){toast(err.message,true);if(el)el.disabled=false;}
});
document.addEventListener('submit',async e=>{
 const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(form.dataset.busy)return;
 const kind=form.dataset.form,b=Object.fromEntries(new FormData(form));const submit=form.querySelector('[type="submit"]');const error=form.querySelector('.form-error');
 if(error)error.textContent='';if(submit)submit.disabled=true;form.dataset.busy='1';
 try{
  if(kind==='login'){
   const login=await api('/api/login','POST',b);S.session=login;
   S.session=await api('/api/session');await refresh();S.date=S.data?.date||dateKey();
   S.view=S.session.user.role==='SUPER_ADMIN'?'admin':'home';if(!PREVIEW)history.replaceState({},'',paths[S.view]);render();return;
  }
  if(kind==='global-search'){S.patientSearch=b.query||'';await navigate('patients');return;}
  if(kind==='chat'){form.querySelector('input').value='';await sendChat(b.text);return;}
  let response,message='Cambios guardados.';
  switch(kind){
   case 'patient':response=await api('/api/patients','POST',b);message='Paciente de prueba registrado.';S.view='patients';break;
   case 'edit-patient':await api('/api/patients/'+form.dataset.id,'PATCH',b);message='Ficha del paciente actualizada.';break;
   case 'appointment':case 'reschedule':{
    const data={patientId:b.patientId||S.data.appointments.find(a=>a.id===form.dataset.id)?.patientId,doctorId:b.doctorId,startAt:localAt(b.date,b.time),duration:Number(b.duration),type:b.type,notes:b.notes};
    await api(kind==='appointment'?'/api/appointments':'/api/appointments/'+form.dataset.id,kind==='appointment'?'POST':'PATCH',data);S.date=b.date;S.view='schedule';message=kind==='appointment'?'Turno guardado en la agenda local.':'Turno reprogramado.';break;
   }
   case 'appointment-status':await api('/api/appointments/'+form.dataset.id,'PATCH',{status:b.status});message='Estado del turno actualizado.';break;
   case 'lead':await api('/api/leads','POST',b);S.view='pipeline';message='Contacto agregado al seguimiento.';break;
   case 'record':{if(form.dataset.amendment){b.amendmentOf=form.dataset.amendment;b.patientId=S.data.records.find(r=>r.id===b.amendmentOf).patientId;}await api('/api/records','POST',b);S.selectedPatient=b.patientId;S.view='records';S.recordTab='notes';message='Evolución guardada. No se generó una firma digital certificada.';break;}
   case 'prescription':await api('/api/prescriptions','POST',b);S.view='records';S.recordTab='prescriptions';S.selectedPatient=b.patientId;message='Borrador guardado. No válido para dispensación.';break;
   case 'payment':await api('/api/payments','POST',{...b,amount:Number(b.amount)},{'Idempotency-Key':form.dataset.key});S.view='billing';S.billingTab='payments';message='Registro de prueba guardado. No se verificó dinero recibido.';break;
   case 'invoice':await api('/api/invoices','POST',{...b,amount:Number(b.amount)});S.view='billing';S.billingTab='invoices';message='Borrador guardado. Sin CAE ni validez fiscal.';break;
   case 'workspace':await api('/api/admin/workspaces','POST',b);message='Clínica demo creada, sin usuarios de acceso.';break;
  }
  await refresh();closeModal();if(!PREVIEW)history.replaceState({},'',paths[S.view]);render();toast(message);
 }catch(err){if(error)error.textContent=err.message;else toast(err.message,true);}
 finally{delete form.dataset.busy;if(submit)submit.disabled=false;}
});
document.addEventListener('input',e=>{
 if(e.target.dataset.input==='patient-search'){
  const value=e.target.value,start=e.target.selectionStart;S.patientSearch=value;contentOnly();const input=$('#patient-search');input.focus();input.setSelectionRange(start,start);
 }
});
document.addEventListener('change',async e=>{
 const el=e.target,key=el.dataset.change;if(!key)return;
 try{
  if(key==='patient-status'){S.patientStatus=el.value;contentOnly();}
  if(key==='date'){if(el.value)S.date=el.value;contentOnly();}
  if(key==='doctor'){S.doctor=el.value;contentOnly();}
  if(key==='lead-status'){el.disabled=true;await api('/api/leads/'+el.dataset.id,'PATCH',{status:el.value});await refresh();contentOnly();toast('Etapa actualizada. No se enviaron mensajes.');}
 }catch(err){toast(err.message,true);contentOnly();}
});
document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-lead]');if(card)e.dataTransfer.setData('text/plain',card.dataset.lead);});
document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop]');if(col){e.preventDefault();col.classList.add('drag-over');}});
document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drag-over');});
document.addEventListener('drop',async e=>{const col=e.target.closest('[data-drop]');if(!col)return;e.preventDefault();col.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain');if(!S.data.leads.some(l=>l.id===id))return;try{await api('/api/leads/'+id,'PATCH',{status:col.dataset.drop});await refresh();contentOnly();toast('Contacto movido.');}catch(err){toast(err.message,true);}});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();$('#global-search')?.focus();}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action][role="button"]')){e.preventDefault();e.target.click();}
});
window.addEventListener('popstate',()=>{if(!S.session)return;S.view=Object.keys(paths).find(k=>paths[k]===location.pathname)||'home';if(S.session.user.role==='SUPER_ADMIN')S.view='admin';if(S.view==='admin'&&S.session.user.role!=='SUPER_ADMIN')S.view='home';closeModal();render();});
async function boot(){
 if(!PREVIEW&&location.pathname.startsWith('/verify/'))return verifyPage(decodeURIComponent(location.pathname.slice(8)));
 try{S.session=await api('/api/session');await refresh();S.date=S.data?.date||dateKey();S.view=S.session.user.role==='SUPER_ADMIN'?'admin':(Object.keys(paths).find(k=>paths[k]===location.pathname)||'home');if(S.view==='admin'&&S.session.user.role!=='SUPER_ADMIN')S.view='home';render();}
 catch(err){S.session=null;if(err.status===401||PREVIEW)loginPage();else loginPage('No se pudo conectar al servidor. Inicia la app con Node y recarga.');}
}
boot();
})();
</script>
</body>
</html>
